[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "econophysics"
version = "0.1.0"
description = "Reproducible statistical mechanics of money experiments"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "David Felipe Medina Mayorga" }]
dependencies = []

[project.scripts]
econophysics = "econophysics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
